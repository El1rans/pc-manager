name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    runs-on: windows-latest
    # Least privilege: only this job needs to create a release; every other workflow/job in this
    # repo keeps the default read-only GITHUB_TOKEN.
    permissions:
      contents: write
    env:
      # Read once here rather than inlined as ${{ github.ref_name }} in each step's script body -
      # keeps every step's PowerShell working with a plain environment variable instead of
      # interpolating a GitHub Actions expression directly into script text.
      TAG: ${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history (not just the tagged commit) so the "tag is on main" ancestor check below
          # has origin/main's commits to check against.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Verify the tagged commit is on main
        shell: pwsh
        run: |
          git fetch origin main
          $isAncestor = & git merge-base --is-ancestor "$env:TAG" origin/main; $LASTEXITCODE -eq 0
          if (-not $isAncestor) {
            throw "Tag '$env:TAG' is not an ancestor of origin/main - refusing to release a commit that was never merged."
          }
          Write-Host "Tag '$env:TAG' is on origin/main."

      - name: Verify tag matches Directory.Build.props Version
        id: version
        shell: pwsh
        run: |
          $content = Get-Content Directory.Build.props -Raw
          if ($content -notmatch '<Version>([^<]+)</Version>') {
            throw "Could not find <Version> in Directory.Build.props"
          }
          $version = $Matches[1]

          $tagVersion = $env:TAG.TrimStart("v")
          if ($tagVersion -ne $version) {
            throw "Tag '$env:TAG' (version '$tagVersion') does not match Directory.Build.props <Version>$version</Version>."
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Releasing version $version (tag $env:TAG)."

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build

      - name: Publish self-contained single-file win-x64 build
        run: >
          dotnet publish src/PCManager.App -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Install Inno Setup
        run: choco install innosetup --version=6.7.1 -y --no-progress

      - name: Compile installer
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            installer\PCManager.iss `
            "/DMyAppVersion=$env:VERSION" `
            "/DPublishDir=$PWD\publish" `
            "/O$PWD\dist"

      - name: Compute SHA-256 checksum
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $exe = "dist\PCManager-Setup-$env:VERSION.exe"
          $hash = (Get-FileHash -Path $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *PCManager-Setup-$env:VERSION.exe" | Set-Content -Path "$exe.sha256" -NoNewline

      - name: Extract CHANGELOG section for this version
        id: notes
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $lines = Get-Content CHANGELOG.md
          $heading = "## [$env:VERSION]"
          $startIndex = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i].StartsWith($heading)) {
              $startIndex = $i + 1
              break
            }
          }
          if ($startIndex -lt 0) {
            throw "CHANGELOG.md has no '$heading' section. Add one before tagging - see docs/RELEASING.md."
          }

          $endIndex = $lines.Count
          for ($i = $startIndex; $i -lt $lines.Count; $i++) {
            if ($lines[$i].StartsWith("## [")) {
              $endIndex = $i
              break
            }
          }

          $notes = ($lines[$startIndex..($endIndex - 1)] -join "`n").Trim()
          if ([string]::IsNullOrWhiteSpace($notes)) {
            throw "The '$heading' CHANGELOG.md section is empty - add release notes before tagging."
          }

          $notesPath = "release-notes.md"
          Set-Content -Path $notesPath -Value $notes
          "notesPath=$notesPath" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          NOTES_PATH: ${{ steps.notes.outputs.notesPath }}
        shell: pwsh
        run: |
          $exe = "dist\PCManager-Setup-$env:VERSION.exe"
          gh release create "$env:TAG" `
            "$exe" "$exe.sha256" `
            --title "PC Manager $env:VERSION" `
            --notes-file "$env:NOTES_PATH" `
            --verify-tag
