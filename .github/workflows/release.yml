name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    runs-on: windows-latest
    # Least privilege: `contents: write` is needed only because this job creates the GitHub
    # Release at the end; `actions: read` is needed only for the SignPath action's default
    # github-token to read this run's own uploaded artifacts back (upload-artifact/download of an
    # artifact from the *same* run needs actions:read even though it never touches another repo or
    # workflow). Every other workflow/job in this repo keeps the default read-only GITHUB_TOKEN.
    # Signing never runs on pull requests: this whole workflow only triggers on a `v*.*.*` tag
    # push, and tags can only be pushed by someone with write access to this repository.
    permissions:
      contents: write
      actions: read
    env:
      # Read once here rather than inlined as ${{ github.ref_name }} in each step's script body -
      # keeps every step's PowerShell working with a plain environment variable instead of
      # interpolating a GitHub Actions expression directly into script text.
      TAG: ${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history (not just the tagged commit) so the "tag is on main" ancestor check below
          # has origin/main's commits to check against.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Verify the tagged commit is on main
        shell: pwsh
        run: |
          git fetch origin main
          $isAncestor = & git merge-base --is-ancestor "$env:TAG" origin/main; $LASTEXITCODE -eq 0
          if (-not $isAncestor) {
            throw "Tag '$env:TAG' is not an ancestor of origin/main - refusing to release a commit that was never merged."
          }
          Write-Host "Tag '$env:TAG' is on origin/main."

      - name: Verify tag matches Directory.Build.props Version
        id: version
        shell: pwsh
        run: |
          $content = Get-Content Directory.Build.props -Raw
          if ($content -notmatch '<Version>([^<]+)</Version>') {
            throw "Could not find <Version> in Directory.Build.props"
          }
          $version = $Matches[1]

          $tagVersion = $env:TAG.TrimStart("v")
          if ($tagVersion -ne $version) {
            throw "Tag '$env:TAG' (version '$tagVersion') does not match Directory.Build.props <Version>$version</Version>."
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Releasing version $version (tag $env:TAG)."

      - name: Determine whether SignPath signing is configured
        # Lets every release build succeed (unsigned) before the SignPath application in
        # docs/signing/APPLICATION.md is approved and the one-time setup in docs/RELEASING.md's
        # "Code signing (SignPath)" section is done - see docs/CODE_SIGNING_POLICY.md. Checked via
        # a script step (not a job/step `if:` expression) so a missing secret/variable can also
        # print a clearly visible `::warning::` in the run's summary.
        id: signing
        shell: pwsh
        env:
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNPATH_ORGANIZATION_ID) -or [string]::IsNullOrWhiteSpace($env:SIGNPATH_API_TOKEN)) {
            Write-Host "::warning::SignPath code signing is not configured yet (repo variable SIGNPATH_ORGANIZATION_ID and/or repo secret SIGNPATH_API_TOKEN is missing) - publishing this release UNSIGNED. See docs/RELEASING.md's 'Code signing (SignPath)' section to set it up."
            "enabled=false" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "SignPath signing is configured - this release will be signed."
            "enabled=true" >> $env:GITHUB_OUTPUT
          }

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build

      - name: Publish self-contained single-file win-x64 build
        run: >
          dotnet publish src/PCManager.App -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      # --- Stage 1: sign PCManager.exe before it goes into the installer -----------------------

      - name: Zip PCManager.exe for signing
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: Compress-Archive -Path publish\PCManager.exe -DestinationPath app-to-sign.zip
        # docs/signing/app.xml's artifact configuration expects a zip-file containing
        # PCManager.exe (rather than the bare exe) - this is what lets SignPath return a signed
        # zip that github-action-submit-signing-request can decompress back into a signed
        # PCManager.exe, matching a plain <pe-file> configuration's single-file semantics.

      - name: Upload app artifact for signing
        if: steps.signing.outputs.enabled == 'true'
        id: upload-app
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: app-to-sign
          path: app-to-sign.zip
          retention-days: 1

      - name: Submit PCManager.exe for signing
        if: steps.signing.outputs.enabled == 'true'
        id: sign-app
        # v3.0, pinned to its full commit SHA (see docs/RELEASING.md's "Code signing (SignPath)"
        # section for how this was resolved:
        # `gh api repos/signpath/github-action-submit-signing-request/git/ref/tags/v3.0`).
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'pc-manager' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.upload-app.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: "1800" # 30 minutes - covers a manual SignPath approval click.
          output-artifact-directory: signed-app

      - name: Verify PCManager.exe's signature
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature -FilePath "signed-app\PCManager.exe"
          Write-Host "PCManager.exe signature status: $($sig.Status); signer: $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') {
            throw "PCManager.exe's Authenticode signature is not valid (status: $($sig.Status)) after a SignPath signing request was configured and completed."
          }
          if ($sig.SignerCertificate.Subject -notmatch 'SignPath Foundation') {
            throw "PCManager.exe was signed, but not by SignPath Foundation (signer subject: $($sig.SignerCertificate.Subject))."
          }

      - name: Use the signed PCManager.exe for the installer
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: Copy-Item -Path signed-app\PCManager.exe -Destination publish\PCManager.exe -Force

      - name: Install Inno Setup
        run: choco install innosetup --version=6.7.1 -y --no-progress

      - name: Compile installer
        # Compiles from whatever is now in publish\PCManager.exe - the signed one when signing is
        # configured (copied over just above), the plain unsigned publish output otherwise.
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            installer\PCManager.iss `
            "/DMyAppVersion=$env:VERSION" `
            "/DPublishDir=$PWD\publish" `
            "/O$PWD\dist"

      # --- Stage 2: sign the compiled installer -------------------------------------------------

      - name: Upload installer artifact for signing
        if: steps.signing.outputs.enabled == 'true'
        id: upload-installer
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: installer-to-sign
          path: dist/PCManager-Setup-${{ steps.version.outputs.version }}.exe
          retention-days: 1

      - name: Submit installer for signing
        if: steps.signing.outputs.enabled == 'true'
        id: sign-installer
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'pc-manager' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.upload-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: "1800" # 30 minutes - covers a manual SignPath approval click.
          output-artifact-directory: signed-installer

      - name: Verify the installer's signature
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $signedExe = "signed-installer\PCManager-Setup-$env:VERSION.exe"
          $sig = Get-AuthenticodeSignature -FilePath $signedExe
          Write-Host "Installer signature status: $($sig.Status); signer: $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') {
            throw "The installer's Authenticode signature is not valid (status: $($sig.Status)) after a SignPath signing request was configured and completed."
          }
          if ($sig.SignerCertificate.Subject -notmatch 'SignPath Foundation') {
            throw "The installer was signed, but not by SignPath Foundation (signer subject: $($sig.SignerCertificate.Subject))."
          }

      - name: Use the signed installer for the release
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: Copy-Item -Path "signed-installer\PCManager-Setup-$env:VERSION.exe" -Destination "dist\PCManager-Setup-$env:VERSION.exe" -Force

      - name: Compute SHA-256 checksum
        # Always runs last, after the signed installer (if any) has replaced the unsigned one
        # above - the published checksum must match whatever file is actually attached to the
        # release, signed or not.
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $exe = "dist\PCManager-Setup-$env:VERSION.exe"
          $hash = (Get-FileHash -Path $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *PCManager-Setup-$env:VERSION.exe" | Set-Content -Path "$exe.sha256" -NoNewline

      - name: Extract CHANGELOG section for this version
        id: notes
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $lines = Get-Content CHANGELOG.md
          $heading = "## [$env:VERSION]"
          $startIndex = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i].StartsWith($heading)) {
              $startIndex = $i + 1
              break
            }
          }
          if ($startIndex -lt 0) {
            throw "CHANGELOG.md has no '$heading' section. Add one before tagging - see docs/RELEASING.md."
          }

          $endIndex = $lines.Count
          for ($i = $startIndex; $i -lt $lines.Count; $i++) {
            if ($lines[$i].StartsWith("## [")) {
              $endIndex = $i
              break
            }
          }

          $notes = ($lines[$startIndex..($endIndex - 1)] -join "`n").Trim()
          if ([string]::IsNullOrWhiteSpace($notes)) {
            throw "The '$heading' CHANGELOG.md section is empty - add release notes before tagging."
          }

          $notesPath = "release-notes.md"
          Set-Content -Path $notesPath -Value $notes
          "notesPath=$notesPath" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          NOTES_PATH: ${{ steps.notes.outputs.notesPath }}
        shell: pwsh
        run: |
          $exe = "dist\PCManager-Setup-$env:VERSION.exe"
          gh release create "$env:TAG" `
            "$exe" "$exe.sha256" `
            --title "PC Manager $env:VERSION" `
            --notes-file "$env:NOTES_PATH" `
            --verify-tag
