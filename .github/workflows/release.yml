name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  # Read once here rather than inlined as ${{ github.ref_name }} in each step's script body - keeps
  # every step's PowerShell working with a plain environment variable instead of interpolating a
  # GitHub Actions expression directly into script text. A top-level `env:` is visible to every job.
  TAG: ${{ github.ref_name }}

jobs:
  # ---------------------------------------------------------------------------------------------
  # build-sign: builds, tests, publishes, compiles the installer, and (if configured) submits both
  # Porchlight.exe and the compiled installer to SignPath for signing. Needs `contents: write`
  # nowhere - it never touches the GitHub Release - so it only gets `contents: read` (to check out
  # the repo) and `actions: read` (required by the SignPath action to read this same run's own
  # uploaded artifacts back; see github-action-submit-signing-request's docs - this never grants
  # access to another repo or workflow run). `environment: release` scopes SIGNPATH_API_TOKEN as an
  # environment secret, gated by that environment's deployment rule restricting it to `v*.*.*` tags
  # (see docs/RELEASING.md's "Code signing (SignPath)" section for the one-time setup).
  build-sign:
    runs-on: windows-latest
    environment: release
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      signed: ${{ steps.signing.outputs.enabled }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history (not just the tagged commit) so the "tag is on main" ancestor check below
          # has origin/main's commits to check against.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Verify the tagged commit is on main
        shell: pwsh
        run: |
          git fetch origin main
          & git merge-base --is-ancestor "$env:TAG" origin/main
          $isAncestor = ($LASTEXITCODE -eq 0)
          if (-not $isAncestor) {
            throw "Tag '$env:TAG' is not an ancestor of origin/main - refusing to release a commit that was never merged."
          }
          Write-Host "Tag '$env:TAG' is on origin/main."

      - name: Verify tag matches Directory.Build.props Version
        id: version
        shell: pwsh
        run: |
          $content = Get-Content Directory.Build.props -Raw
          if ($content -notmatch '<Version>([^<]+)</Version>') {
            throw "Could not find <Version> in Directory.Build.props"
          }
          $version = $Matches[1]

          $tagVersion = $env:TAG.TrimStart("v")
          if ($tagVersion -ne $version) {
            throw "Tag '$env:TAG' (version '$tagVersion') does not match Directory.Build.props <Version>$version</Version>."
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Releasing version $version (tag $env:TAG)."

      - name: Determine whether SignPath signing is configured
        # Lets every release build succeed (unsigned) before the SignPath application in
        # docs/signing/APPLICATION.md is approved and the one-time setup in docs/RELEASING.md's
        # "Code signing (SignPath)" section is done - see docs/CODE_SIGNING_POLICY.md. Checked via
        # a script step (not a job/step `if:` expression) so a missing secret/variable can also
        # print a clearly visible `::warning::` in the run's summary. The repo/environment variable
        # SIGNPATH_REQUIRED=true opts into failing the release instead of silently publishing
        # unsigned - flip it on once SignPath is expected to always be configured.
        id: signing
        shell: pwsh
        env:
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_REQUIRED: ${{ vars.SIGNPATH_REQUIRED }}
        run: |
          $configured = -not ([string]::IsNullOrWhiteSpace($env:SIGNPATH_ORGANIZATION_ID) -or [string]::IsNullOrWhiteSpace($env:SIGNPATH_API_TOKEN))
          if (-not $configured) {
            $message = "SignPath code signing is not configured yet (repo/environment variable SIGNPATH_ORGANIZATION_ID and/or environment secret SIGNPATH_API_TOKEN is missing)."
            if ($env:SIGNPATH_REQUIRED -eq 'true') {
              throw "$message SIGNPATH_REQUIRED is 'true', so refusing to publish an unsigned release. See docs/RELEASING.md's 'Code signing (SignPath)' section."
            }
            Write-Host "::warning::$message Publishing this release UNSIGNED. See docs/RELEASING.md's 'Code signing (SignPath)' section to set it up."
            "enabled=false" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "SignPath signing is configured - this release will be signed."
            "enabled=true" >> $env:GITHUB_OUTPUT
          }

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build

      - name: Publish self-contained single-file win-x64 build
        run: >
          dotnet publish src/Porchlight.App -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      # --- Stage 1: sign Porchlight.exe before it goes into the installer -----------------------
      #
      # actions/upload-artifact always zips whatever `path` it is given before storing it, so
      # uploading `publish/Porchlight.exe` directly (no local Compress-Archive step) already
      # produces exactly the zip-containing-Porchlight.exe that docs/signing/app.xml's
      # <zip-file><pe-file path="Porchlight.exe"> configuration expects - matching what
      # github-action-submit-signing-request hands back too (a decompressed Porchlight.exe).

      - name: Upload app artifact for signing
        if: steps.signing.outputs.enabled == 'true'
        id: upload-app
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: app-to-sign
          path: publish/Porchlight.exe
          retention-days: 1

      - name: Submit Porchlight.exe for signing
        if: steps.signing.outputs.enabled == 'true'
        id: sign-app
        # v3.0, pinned to its full commit SHA (see docs/RELEASING.md's "Code signing (SignPath)"
        # section for how this was resolved:
        # `gh api repos/signpath/github-action-submit-signing-request/git/ref/tags/v3.0`).
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'porchlight' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.upload-app.outputs.artifact-id }}
          # Maps to docs/signing/app.xml's <parameters><parameter name="version"> - enforced there
          # as a required product-version metadata restriction (SignPath Foundation requires
          # artifact metadata restrictions). github-token is left at its default (${{ github.token
          # }}); this job's own `permissions:` above already keeps it read-only.
          parameters: |
            version: "${{ steps.version.outputs.version }}"
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: "1800" # 30 minutes - covers a manual SignPath approval click.
          output-artifact-directory: signed-app

      - name: Verify Porchlight.exe's signature
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature -FilePath "signed-app\Porchlight.exe"
          Write-Host "Porchlight.exe signature status: $($sig.Status); signer: $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') {
            throw "Porchlight.exe's Authenticode signature is not valid (status: $($sig.Status)) after a SignPath signing request was configured and completed."
          }
          if ($sig.SignerCertificate.Subject -notmatch 'SignPath Foundation') {
            throw "Porchlight.exe was signed, but not by SignPath Foundation (signer subject: $($sig.SignerCertificate.Subject))."
          }
          if ($null -eq $sig.TimeStamperCertificate) {
            throw "Porchlight.exe's signature has no timestamp - it would stop validating once the signing certificate expires."
          }

      - name: Use the signed Porchlight.exe for the installer
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: Copy-Item -Path signed-app\Porchlight.exe -Destination publish\Porchlight.exe -Force

      - name: Install Inno Setup
        run: choco install innosetup --version=6.7.1 -y --no-progress

      - name: Compile installer
        # Compiles from whatever is now in publish\Porchlight.exe - the signed one when signing is
        # configured (copied over just above), the plain unsigned publish output otherwise.
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            installer\Porchlight.iss `
            "/DMyAppVersion=$env:VERSION" `
            "/DPublishDir=$PWD\publish" `
            "/O$PWD\dist"

      # --- Stage 2: sign the compiled installer -------------------------------------------------
      #
      # Same reasoning as Stage 1: upload-artifact zips dist/Porchlight-Setup-<version>.exe as-is, so
      # docs/signing/installer.xml is a <zip-file><pe-file path="Porchlight-Setup-${version}.exe">
      # configuration (the exact versioned filename, via the same `version` parameter, rather than
      # a wildcard) matching that zip's contents.

      - name: Upload installer artifact for signing
        if: steps.signing.outputs.enabled == 'true'
        id: upload-installer
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: installer-to-sign
          path: dist/Porchlight-Setup-${{ steps.version.outputs.version }}.exe
          retention-days: 1

      - name: Submit installer for signing
        if: steps.signing.outputs.enabled == 'true'
        id: sign-installer
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'porchlight' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.upload-installer.outputs.artifact-id }}
          # Maps to docs/signing/installer.xml's <parameters><parameter name="version"> - used both
          # for the required product-version metadata restriction and to build the exact
          # `Porchlight-Setup-${version}.exe` path inside the uploaded zip.
          parameters: |
            version: "${{ steps.version.outputs.version }}"
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: "1800" # 30 minutes - covers a manual SignPath approval click.
          output-artifact-directory: signed-installer

      - name: Verify the installer's signature
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $signedExe = "signed-installer\Porchlight-Setup-$env:VERSION.exe"
          $sig = Get-AuthenticodeSignature -FilePath $signedExe
          Write-Host "Installer signature status: $($sig.Status); signer: $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') {
            throw "The installer's Authenticode signature is not valid (status: $($sig.Status)) after a SignPath signing request was configured and completed."
          }
          if ($sig.SignerCertificate.Subject -notmatch 'SignPath Foundation') {
            throw "The installer was signed, but not by SignPath Foundation (signer subject: $($sig.SignerCertificate.Subject))."
          }
          if ($null -eq $sig.TimeStamperCertificate) {
            throw "The installer's signature has no timestamp - it would stop validating once the signing certificate expires."
          }

      - name: Use the signed installer for the release
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: Copy-Item -Path "signed-installer\Porchlight-Setup-$env:VERSION.exe" -Destination "dist\Porchlight-Setup-$env:VERSION.exe" -Force

      - name: Compute SHA-256 checksum
        # Always runs last, after the signed installer (if any) has replaced the unsigned one
        # above - the published checksum must match whatever file is actually attached to the
        # release, signed or not.
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $exe = "dist\Porchlight-Setup-$env:VERSION.exe"
          $hash = (Get-FileHash -Path $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *Porchlight-Setup-$env:VERSION.exe" | Set-Content -Path "$exe.sha256" -NoNewline

      - name: Extract CHANGELOG section for this version
        id: notes
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $lines = Get-Content CHANGELOG.md
          $heading = "## [$env:VERSION]"
          $startIndex = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i].StartsWith($heading)) {
              $startIndex = $i + 1
              break
            }
          }
          if ($startIndex -lt 0) {
            throw "CHANGELOG.md has no '$heading' section. Add one before tagging - see docs/RELEASING.md."
          }

          $endIndex = $lines.Count
          for ($i = $startIndex; $i -lt $lines.Count; $i++) {
            if ($lines[$i].StartsWith("## [")) {
              $endIndex = $i
              break
            }
          }

          $notes = ($lines[$startIndex..($endIndex - 1)] -join "`n").Trim()
          if ([string]::IsNullOrWhiteSpace($notes)) {
            throw "The '$heading' CHANGELOG.md section is empty - add release notes before tagging."
          }

          # S4: make an unsigned release visibly unsigned in the notes themselves, not just in the
          # SmartScreen warning a user hits later. S3: always link the code signing policy.
          if ('${{ steps.signing.outputs.enabled }}' -ne 'true') {
            $notes = "**This release is unsigned.** See [Code signing policy](https://github.com/El1rans/porchlight/blob/main/docs/CODE_SIGNING_POLICY.md) for why and how that changes.`n`n$notes"
          } else {
            $notes = "$notes`n`n---`n[Code signing policy](https://github.com/El1rans/porchlight/blob/main/docs/CODE_SIGNING_POLICY.md)"
          }

          $notesPath = "release-notes.md"
          Set-Content -Path $notesPath -Value $notes
          "notesPath=$notesPath" >> $env:GITHUB_OUTPUT

      - name: Upload release assets
        # Hands the signed (or unsigned-fallback) installer, its checksum, and the release notes to
        # the `publish` job, which is the only job with `contents: write` - see that job's comment.
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: release-assets
          path: |
            dist/Porchlight-Setup-${{ steps.version.outputs.version }}.exe
            dist/Porchlight-Setup-${{ steps.version.outputs.version }}.exe.sha256
            release-notes.md
          retention-days: 1

  # ---------------------------------------------------------------------------------------------
  # publish: the only job with `contents: write` (needed solely to create the GitHub Release), and
  # the only one that runs `gh release create`. It never touches SignPath credentials and never
  # builds anything itself - it just downloads what build-sign already produced and publishes it.
  publish:
    needs: build-sign
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-assets
          path: release-assets

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build-sign.outputs.version }}
        run: |
          exe="release-assets/dist/Porchlight-Setup-${VERSION}.exe"
          gh release create "$TAG" \
            "$exe" "$exe.sha256" \
            --title "Porchlight $VERSION" \
            --notes-file "release-assets/release-notes.md" \
            --verify-tag
